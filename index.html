<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Fitness Cutting Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        themeDark: '#000000',
                        themeCard: '#1c1c1e',
                        themeCardHover: '#2c2c2e',
                        themeBlue: '#0a84ff',
                        themeOrange: '#ff9f0a',
                        themeGreen: '#30d158',
                        themeRed: '#ff453a',
                        themePurple: '#af52de',
                        themeGray: '#8e8e93',
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex justify-center items-center">

    <div id="root" class="w-full max-w-md h-[100vh] sm:h-[880px] sm:rounded-[40px] sm:border-[8px] sm:border-[#333] overflow-hidden flex flex-col bg-themeDark relative shadow-2xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const defaultWeeklySchedule = {
            'Monday': { label: 'Monday', focus: 'Chest & back, abs', type: 'strength', duration: '45 mins', burn: 380, exercises: ['Bench Press - 3 sets x 10 reps', 'Lat Pulldown - 3 sets x 12 reps', 'Push-ups - 3 sets x 15 reps', 'Crunches - 3 sets x 20 reps'] },
            'Tuesday': { label: 'Tuesday', focus: 'Treadmill 1hr', type: 'cardio', duration: '60 mins', burn: 550, exercises: ['Treadmill Incline Walk / Jog - 60 mins', 'Cool down stretch - 10 mins'] },
            'Wednesday': { label: 'Wednesday', focus: 'Shoulder, bicep, tricep', type: 'strength', duration: '45 mins', burn: 350, exercises: ['Shoulder Press - 3 sets x 10 reps', 'Bicep Curls - 3 sets x 12 reps', 'Tricep Pushdowns - 3 sets x 12 reps'] },
            'Thursday': { label: 'Thursday', focus: 'Treadmill 1hr', type: 'cardio', duration: '60 mins', burn: 550, exercises: ['Treadmill Steady State Run - 60 mins', 'Core Planks - 3 sets x 1 min'] },
            'Friday': { label: 'Friday', focus: 'Leg day & abs', type: 'strength', duration: '50 mins', burn: 450, exercises: ['Goblet Squats - 4 sets x 10 reps', 'Lunges - 3 sets x 12 reps', 'Leg Raises - 3 sets x 15 reps'] },
            'Saturday': { label: 'Saturday', focus: 'Rest & Recovery', type: 'rest', duration: '0 mins', burn: 80, exercises: ['Light walking & stretching', 'Hydration focus'] },
            'Sunday': { label: 'Sunday', focus: 'Rest & Recovery', type: 'rest', duration: '0 mins', burn: 80, exercises: ['Full body mobility', 'Meal prep for upcoming week'] },
        };

        function App() {
            const [permissionGranted, setPermissionGranted] = useState(false);
            const [permissionModalOpen, setPermissionModalOpen] = useState(false);

            // Real-time device date sync
            const todayObj = new Date();
            const formatYMD = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const todayKey = formatYMD(todayObj);
            const [currentTab, setCurrentTab] = useState('routine');
            const [selectedDate, setSelectedDate] = useState(todayKey);
            
            // Dynamic calendar browsing state (Defaults to current phone year & month index)
            const [viewYear, setViewYear] = useState(todayObj.getFullYear());
            const [viewMonthIndex, setViewMonthIndex] = useState(todayObj.getMonth()); // 0-11

            const [dailyLogs, setDailyLogs] = useState({});
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: '', title: '' });
            const [dailyWeightPromptOpen, setDailyWeightPromptOpen] = useState(false);
            const [promptWeightInput, setPromptWeightInput] = useState('');
            const [toast, setToast] = useState('');

            const dateRefs = useRef({});

            useEffect(() => {
                // Check if permission was already granted previously
                const hasPerm = localStorage.getItem('health_permission_v11');
                if (hasPerm === 'granted') {
                    setPermissionGranted(true);
                    setPermissionModalOpen(false);
                } else {
                    // Show only on first ever visit
                    setPermissionModalOpen(true);
                }

                const savedLogs = localStorage.getItem('health_fitness_logs_v11');
                let parsedLogs = {};
                if (savedLogs) {
                    try { parsedLogs = JSON.parse(savedLogs); } catch (e) {}
                }
                setDailyLogs(parsedLogs);

                // Daily weight prompt check (once per day)
                const lastPromptDate = localStorage.getItem('last_weight_prompt_date_v11');
                if (hasPerm === 'granted' && lastPromptDate !== todayKey) {
                    const todayExisting = parsedLogs[todayKey]?.weight || '';
                    setPromptWeightInput(todayExisting);
                    setDailyWeightPromptOpen(true);
                }

                scrollToDate(todayKey);
            }, []);

            const handleGrantPermission = () => {
                localStorage.setItem('health_permission_v11', 'granted');
                setPermissionGranted(true);
                setPermissionModalOpen(false);
                showToast('Permissions saved permanently!');

                const lastPromptDate = localStorage.getItem('last_weight_prompt_date_v11');
                if (lastPromptDate !== todayKey) {
                    const todayExisting = dailyLogs[todayKey]?.weight || '';
                    setPromptWeightInput(todayExisting);
                    setDailyWeightPromptOpen(true);
                }
            };

            const scrollToDate = (dateStr) => {
                setTimeout(() => {
                    if (dateRefs.current[dateStr]) {
                        dateRefs.current[dateStr].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }, 50);
            };

            const handleDateSelect = (dateStr) => {
                setSelectedDate(dateStr);
                const parts = dateStr.split('-');
                setViewYear(parseInt(parts[0], 10));
                setViewMonthIndex(parseInt(parts[1], 10) - 1);
                
                setCurrentTab('routine');
                scrollToDate(dateStr);
            };

            const saveLogsToStorage = (updatedLogs) => {
                setDailyLogs(updatedLogs);
                localStorage.setItem('health_fitness_logs_v11', JSON.stringify(updatedLogs));
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3000);
            };

            const handleDailyWeightSubmit = () => {
                const weightVal = Number(promptWeightInput) || 0;
                const updated = { ...dailyLogs };
                if (!updated[todayKey]) {
                    updated[todayKey] = { workoutDone: false, calorieIntake: 0, water: 0, weight: weightVal };
                } else {
                    updated[todayKey].weight = weightVal;
                }

                saveLogsToStorage(updated);
                localStorage.setItem('last_weight_prompt_date_v11', todayKey);
                setDailyWeightPromptOpen(false);
                showToast(weightVal > 0 ? `Today's weight (${weightVal} kg) recorded!` : `Weight prompt skipped.`);
            };

            const monthNamesList = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const activeMonthName = monthNamesList[viewMonthIndex];

            // Fully dynamic month days calculation
            const daysInActiveMonth = new Date(viewYear, viewMonthIndex + 1, 0).getDate();
            const firstDayOfWeek = new Date(viewYear, viewMonthIndex, 1).getDay(); // 0 (Sun) to 6 (Sat)

            const monthDays = Array.from({ length: daysInActiveMonth }, (_, i) => {
                const dayNum = i + 1;
                const mStr = String(viewMonthIndex + 1).padStart(2, '0');
                const dStr = String(dayNum).padStart(2, '0');
                const dateStr = `${viewYear}-${mStr}-${dStr}`;
                const dateObj = new Date(viewYear, viewMonthIndex, dayNum);
                const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
                return {
                    dateStr,
                    dayNum,
                    dayName: dayNames[dateObj.getDay()],
                    isToday: dateStr === todayKey
                };
            });

            const handlePrevMonth = () => {
                if (viewMonthIndex === 0) {
                    setViewMonthIndex(11);
                    setViewYear(viewYear - 1);
                } else {
                    setViewMonthIndex(viewMonthIndex - 1);
                }
            };

            const handleNextMonth = () => {
                if (viewMonthIndex === 11) {
                    setViewMonthIndex(0);
                    setViewYear(viewYear + 1);
                } else {
                    setViewMonthIndex(viewMonthIndex + 1);
                }
            };

            const getDayOfWeekName = (dateStr) => {
                const parts = dateStr.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                return names[d.getDay()];
            };

            const currentDayName = getDayOfWeekName(selectedDate);
            const currentDayRoutine = defaultWeeklySchedule[currentDayName] || defaultWeeklySchedule['Monday'];
            const currentDayLog = dailyLogs[selectedDate] || { workoutDone: false, calorieIntake: 0, water: 0, weight: 0 };

            // Start weight calculation
            const sortedLogDates = Object.keys(dailyLogs).sort();
            let startWeight = 0;
            for (let dKey of sortedLogDates) {
                if (dailyLogs[dKey]?.weight && dailyLogs[dKey].weight > 0) {
                    startWeight = dailyLogs[dKey].weight;
                    break;
                }
            }
            if (startWeight === 0) {
                startWeight = currentDayLog.weight > 0 ? currentDayLog.weight : 75.0;
            }

            const activeCaloriesBurned = currentDayLog.workoutDone ? currentDayRoutine.burn : 0;
            const calorieIntake = currentDayLog.calorieIntake || 0;
            const netCalories = calorieIntake - activeCaloriesBurned;

            const currentWeight = currentDayLog.weight || startWeight;
            const weightLost = Number((startWeight - currentWeight).toFixed(1));

            const toggleWorkoutStatus = () => {
                const updated = { ...dailyLogs };
                if (!updated[selectedDate]) updated[selectedDate] = { ...currentDayLog };
                updated[selectedDate].workoutDone = !updated[selectedDate].workoutDone;
                saveLogsToStorage(updated);
                showToast(updated[selectedDate].workoutDone ? `Workout completed! +${currentDayRoutine.burn} kcal burned 🔥` : 'Workout status reset.');
            };

            const handleSaveModalData = (field, value) => {
                const updated = { ...dailyLogs };
                if (!updated[selectedDate]) updated[selectedDate] = { ...currentDayLog };
                updated[selectedDate][field] = value;
                saveLogsToStorage(updated);
                showToast(`Successfully updated ${field}!`);
                setModalConfig({ isOpen: false, type: '', title: '' });
            };

            const formatDisplayDate = (dateStr) => {
                if (dateStr === todayKey) return `Today, ${todayObj.getDate()} ${activeMonthName}`;
                const parts = dateStr.split('-');
                const day = parseInt(parts[2], 10);
                const mName = monthNamesList[parseInt(parts[1], 10) - 1];
                return `${day} ${mName} ${parts[0]}`;
            };

            return (
                <div className="flex flex-col h-full bg-themeDark text-white select-none relative w-full">
                    {/* Permission Request Modal (Shows ONLY on first visit) */}
                    {permissionModalOpen && (
                        <div className="absolute inset-0 z-50 bg-black/95 backdrop-blur-2xl flex items-center justify-center p-6">
                            <div className="bg-[#1c1c1e] w-full max-w-xs rounded-3xl p-6 border border-white/20 shadow-2xl flex flex-col gap-4 text-center">
                                <div className="w-14 h-14 bg-themeBlue/25 text-themeBlue rounded-full flex items-center justify-center mx-auto text-3xl">
                                    ❤️
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold text-white">Health & Fitness Access</h3>
                                    <p className="text-xs text-themeGray mt-1.5 leading-relaxed">
                                        Allow "Fitness Tracker" to sync with your device clock, workout schedules, and weight logs. This will only be asked once.
                                    </p>
                                </div>
                                <div className="flex flex-col gap-2.5 mt-2">
                                    <button 
                                        onClick={handleGrantPermission}
                                        className="bg-themeBlue text-white font-bold py-3.5 rounded-2xl hover:opacity-90 transition-all shadow-lg text-sm"
                                    >
                                        Allow Access (Once)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Daily Weight Check-in Modal */}
                    {dailyWeightPromptOpen && (
                        <div className="absolute inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-6">
                            <div className="bg-[#1c1c1e] w-full max-w-xs rounded-3xl p-6 border border-white/20 shadow-2xl flex flex-col gap-4 text-center">
                                <div className="w-12 h-12 bg-themeGreen/20 text-themeGreen rounded-full flex items-center justify-center mx-auto text-2xl">
                                    ⚖️
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold text-white">Daily Weight Check-in</h3>
                                    <p className="text-xs text-themeGray mt-1">Enter your body weight today to track cutting progress:</p>
                                </div>
                                <div className="flex items-center justify-center gap-2 my-1">
                                    <input 
                                        type="number" 
                                        step="0.1" 
                                        placeholder="0.0"
                                        value={promptWeightInput} 
                                        onChange={(e) => setPromptWeightInput(e.target.value)} 
                                        className="w-32 bg-themeCardHover border border-white/20 rounded-2xl px-4 py-3 text-center text-white text-xl font-bold focus:outline-none focus:border-themeGreen"
                                    />
                                    <span className="text-themeGray font-semibold">kg</span>
                                </div>
                                <div className="flex flex-col gap-2">
                                    <button 
                                        onClick={handleDailyWeightSubmit}
                                        className="bg-themeGreen text-black font-bold py-3 rounded-2xl hover:opacity-95 transition-all shadow-lg"
                                    >
                                        Save & Start Day
                                    </button>
                                    <button 
                                        onClick={() => setDailyWeightPromptOpen(false)}
                                        className="text-themeGray text-xs hover:text-white py-1"
                                    >
                                        Skip for now
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast && (
                        <div className="absolute top-14 left-1/2 transform -translate-x-1/2 z-50 bg-[#2c2c2e]/95 backdrop-blur-md text-white text-xs px-4 py-2 rounded-full shadow-lg border border-white/10 flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-themeGreen"></span>
                            {toast}
                        </div>
                    )}

                    {/* Header */}
                    <div className="pt-12 px-4 pb-3 flex items-center justify-between border-b border-white/10 bg-themeDark/90 backdrop-blur-xl sticky top-0 z-40">
                        <button onClick={() => {
                            setViewYear(todayObj.getFullYear());
                            setViewMonthIndex(todayObj.getMonth());
                            handleDateSelect(todayKey);
                        }} className="w-9 h-9 rounded-full bg-themeCardHover flex items-center justify-center text-themeBlue hover:bg-white/20 transition-all" title="Jump to Today">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </button>
                        <h1 className="text-lg font-semibold tracking-tight">
                            {currentTab === 'routine' && 'Fitness & Cutting Log'}
                            {currentTab === 'month' && `${activeMonthName} ${viewYear}`}
                            {currentTab === 'summary' && 'Cutting & Calories'}
                            {currentTab === 'browse' && 'Browse Categories'}
                        </h1>
                        <button onClick={() => setCurrentTab('month')} className="w-9 h-9 rounded-full bg-themeCardHover flex items-center justify-center text-themeBlue hover:bg-white/20 transition-all" title="Full Month View">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        </button>
                    </div>

                    {/* Main Scrollable Body */}
                    <div className="flex-1 overflow-y-auto no-scrollbar pb-28">

                        {/* TAB 1: ROUTINE & DAILY LOG */}
                        {currentTab === 'routine' && (
                            <div className="px-4 py-3 flex flex-col gap-6">
                                <div className="text-center">
                                    <h2 className="text-xl font-bold tracking-tight text-white">
                                        {formatDisplayDate(selectedDate)}
                                    </h2>
                                    <p className="text-xs text-themeGray mt-0.5">{currentDayName} • {currentDayRoutine.focus}</p>
                                </div>

                                {/* Capsule Horizontal Date Bar synced to phone date */}
                                <div className="relative">
                                    <div className="flex justify-center mb-1">
                                        <div className="w-3 h-3 bg-white rotate-45 transform translate-y-1"></div>
                                    </div>
                                    <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-2 px-1">
                                        {monthDays.map((d) => {
                                            const isSelected = selectedDate === d.dateStr;
                                            return (
                                                <div key={d.dateStr} ref={el => dateRefs.current[d.dateStr] = el}>
                                                    <button 
                                                        onClick={() => handleDateSelect(d.dateStr)}
                                                        className={`flex flex-col items-center justify-center min-w-[46px] h-[72px] rounded-full transition-all shrink-0 ${
                                                            d.isToday 
                                                                ? 'bg-white text-black font-bold shadow-lg scale-105' 
                                                                : isSelected 
                                                                    ? 'bg-themeCardHover text-white border border-themeBlue' 
                                                                    : 'bg-themeCard text-themeGray hover:text-white'
                                                        }`}
                                                    >
                                                        <span className="text-[11px] uppercase">{d.dayName}</span>
                                                        <span className="text-base font-semibold mt-1">{d.dayNum}</span>
                                                        {d.isToday && <span className="w-1.5 h-1.5 bg-themeOrange rounded-full mt-1"></span>}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Routine Advice Banner */}
                                <div className="bg-gradient-to-r from-themeBlue/20 to-themePurple/20 border border-themeBlue/30 rounded-2xl p-4">
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-semibold uppercase tracking-wider text-themeBlue">Beginner Cutting Routine</span>
                                        <span className="text-xs bg-themeGreen/20 text-themeGreen px-2 py-0.5 rounded-full font-bold">Est. Burn: ~{currentDayRoutine.burn} kcal</span>
                                    </div>
                                    <h3 className="text-sm font-bold mt-1 text-white">{currentDayRoutine.focus}</h3>
                                    <div className="mt-2.5 pt-2 border-t border-white/10 flex flex-col gap-1">
                                        {currentDayRoutine.exercises.map((ex, idx) => (
                                            <div key={idx} className="flex items-center gap-2 text-xs text-themeGray">
                                                <span className="w-1.5 h-1.5 rounded-full bg-themeBlue"></span>
                                                {ex}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Log Section Header */}
                                <div className="flex items-center justify-between mt-2">
                                    <h3 className="text-2xl font-bold tracking-tight">Fitness Log</h3>
                                    <button onClick={() => setCurrentTab('month')} className="text-themeBlue text-sm font-medium">Month View</button>
                                </div>

                                {/* Workout Completed Card */}
                                <div className="flex flex-col gap-2">
                                    <div className="flex items-center gap-2 text-themeOrange text-xs font-semibold uppercase tracking-wider">
                                        <span className="w-2 h-2 rounded-full bg-themeOrange"></span>
                                        Daily Workout Status (Triggers Active Burn)
                                    </div>
                                    <div 
                                        onClick={toggleWorkoutStatus}
                                        className={`rounded-2xl p-4 flex items-center justify-between cursor-pointer transition-all shadow-md border ${
                                            currentDayLog.workoutDone ? 'bg-[#1b3320] border-themeGreen/40' : 'bg-themeCard border-white/10 hover:bg-themeCardHover'
                                        }`}
                                    >
                                        <div className="flex items-center gap-3">
                                            <span className="text-sm font-medium">{currentDayRoutine.focus}</span>
                                            {currentDayLog.workoutDone && <span className="text-xs bg-themeGreen/30 text-themeGreen px-2 py-0.5 rounded-full font-bold">Completed (+{currentDayRoutine.burn} kcal) ✓</span>}
                                        </div>
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg ${currentDayLog.workoutDone ? 'bg-themeGreen text-black' : 'bg-white/10 text-themeBlue'}`}>
                                            {currentDayLog.workoutDone ? '✓' : '+'}
                                        </div>
                                    </div>
                                </div>

                                {/* Calories & Nutrition Dashboard */}
                                <div className="flex flex-col gap-3">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-2 text-themeBlue text-xs font-semibold uppercase tracking-wider">
                                            <span className="w-2 h-2 rounded-full bg-themeBlue"></span>
                                            Calories & Nutrition Summary
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-themeCard to-[#2c2c2e] rounded-2xl p-4 border border-white/10 flex flex-col gap-3">
                                        <div className="grid grid-cols-2 gap-3 text-center">
                                            <div className="bg-black/30 p-3 rounded-xl border border-white/5">
                                                <span className="text-[10px] text-themeGray">Food Intake</span>
                                                <p className="text-lg font-bold text-themeOrange mt-0.5">{calorieIntake} <span className="text-xs font-normal">kcal</span></p>
                                            </div>
                                            <div className="bg-black/30 p-3 rounded-xl border border-white/5">
                                                <span className="text-[10px] text-themeGray">Workout Burn</span>
                                                <p className="text-lg font-bold text-themeGreen mt-0.5">-{activeCaloriesBurned} <span className="text-xs font-normal">kcal</span></p>
                                            </div>
                                        </div>

                                        <div className="bg-themeBlue/10 p-3 rounded-xl border border-themeBlue/30 flex items-center justify-between">
                                            <div>
                                                <span className="text-xs font-bold text-themeBlue">Net Calories (Intake - Burn)</span>
                                                <p className="text-[10px] text-themeGray">Remaining net energy balance</p>
                                            </div>
                                            <span className="text-xl font-bold text-themeBlue">{netCalories} kcal</span>
                                        </div>
                                    </div>

                                    {/* Action Edit Rows */}
                                    <div className="bg-themeCard rounded-2xl overflow-hidden divide-y divide-white/5 border border-white/5">
                                        <div 
                                            onClick={() => setModalConfig({ isOpen: true, type: 'calorieIntake', title: 'Calorie Intake (kcal)' })}
                                            className="p-4 flex items-center justify-between hover:bg-themeCardHover cursor-pointer transition-all"
                                        >
                                            <span className="text-sm font-medium">Log Food Calorie Intake</span>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs text-themeOrange font-bold">{calorieIntake} kcal</span>
                                                <span className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-themeBlue font-bold">+</span>
                                            </div>
                                        </div>

                                        <div 
                                            onClick={() => setModalConfig({ isOpen: true, type: 'water', title: 'Water Intake (Liters)' })}
                                            className="p-4 flex items-center justify-between hover:bg-themeCardHover cursor-pointer transition-all"
                                        >
                                            <span className="text-sm font-medium">Water Intake</span>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs text-themeBlue font-bold">{currentDayLog.water || 0} L</span>
                                                <span className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-themeBlue font-bold">+</span>
                                            </div>
                                        </div>

                                        <div 
                                            onClick={() => setModalConfig({ isOpen: true, type: 'weight', title: 'Body Weight (kg)' })}
                                            className="p-4 flex items-center justify-between hover:bg-themeCardHover cursor-pointer transition-all"
                                        >
                                            <span className="text-sm font-medium">Body Weight Today</span>
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs text-themePurple font-bold">{currentWeight} kg</span>
                                                <span className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-themeBlue font-bold">+</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: DYNAMIC FULL 1-MONTH CALENDAR GRID */}
                        {currentTab === 'month' && (
                            <div className="px-4 py-3 flex flex-col gap-4">
                                <div className="bg-themeCard rounded-2xl p-4 border border-white/5 flex items-center justify-between">
                                    <div>
                                        <h3 className="text-base font-bold">{activeMonthName} {viewYear}</h3>
                                        <p className="text-xs text-themeGray">Tap any date to view or log workouts.</p>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <button onClick={handlePrevMonth} className="w-8 h-8 rounded-full bg-themeCardHover flex items-center justify-center text-themeBlue hover:bg-white/20 transition-all font-bold">‹</button>
                                        <button onClick={handleNextMonth} className="w-8 h-8 rounded-full bg-themeCardHover flex items-center justify-center text-themeBlue hover:bg-white/20 transition-all font-bold">›</button>
                                    </div>
                                </div>

                                <div className="bg-themeCard rounded-2xl p-4 border border-white/5">
                                    <div className="grid grid-cols-7 gap-2 mb-2">
                                        {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((d, i) => (
                                            <div key={i} className="text-center text-xs font-bold text-themeGray py-1">{d}</div>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-7 gap-2">
                                        {/* Blank offset placeholders */}
                                        {Array.from({ length: firstDayOfWeek }).map((_, i) => (
                                            <div key={`empty-${i}`} className="h-16"></div>
                                        ))}

                                        {monthDays.map((d) => {
                                            const isSelected = selectedDate === d.dateStr;
                                            const dayLog = dailyLogs[d.dateStr];
                                            const isCompleted = dayLog && dayLog.workoutDone;
                                            return (
                                                <button
                                                    key={d.dateStr}
                                                    onClick={() => handleDateSelect(d.dateStr)}
                                                    className={`h-16 rounded-2xl flex flex-col items-center justify-center p-1 border transition-all ${
                                                        isSelected 
                                                            ? 'border-themeBlue bg-themeCardHover shadow-md' 
                                                            : d.isToday 
                                                                ? 'border-themeOrange bg-themeCard' 
                                                                : 'border-white/5 bg-themeCard hover:border-white/20'
                                                    }`}
                                                >
                                                    <span className={`text-xs font-bold ${d.isToday ? 'text-themeOrange' : 'text-white'}`}>{d.dayNum}</span>
                                                    {isCompleted ? (
                                                        <span className="mt-1 w-2 h-2 rounded-full bg-themeGreen"></span>
                                                    ) : (
                                                        <span className="mt-1 w-2 h-2 rounded-full bg-white/10"></span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: SUMMARY & CUTTING WEIGHT LOSS */}
                        {currentTab === 'summary' && (
                            <div className="px-4 py-3 flex flex-col gap-4">
                                <div className="bg-themeCard rounded-2xl p-4 border border-white/5 flex flex-col gap-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-sm font-bold text-themeOrange">Cutting Weight Progress</h3>
                                        <span className="text-[10px] text-themeGray">Auto-detected from history</span>
                                    </div>

                                    <div className="bg-themeGreen/10 border border-themeGreen/30 rounded-xl p-3 flex items-center justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-themeGreen">Total Weight Lost</span>
                                            <p className="text-[10px] text-themeGray">First logged weight ({startWeight} kg) minus Today ({currentWeight} kg)</p>
                                        </div>
                                        <span className="text-xl font-bold text-themeGreen">
                                            {weightLost > 0 ? `-${weightLost} kg` : `${weightLost} kg`}
                                        </span>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 text-center pt-1">
                                        <div className="bg-themeCardHover p-3 rounded-xl">
                                            <span className="text-[10px] text-themeGray">Start Weight (Earliest Log)</span>
                                            <p className="text-lg font-bold text-white mt-0.5">{startWeight} <span className="text-xs font-normal">kg</span></p>
                                        </div>
                                        <div className="bg-themeCardHover p-3 rounded-xl">
                                            <span className="text-[10px] text-themeGray">Current Weight</span>
                                            <p className="text-lg font-bold text-themePurple mt-0.5">{currentWeight} <span className="text-xs font-normal">kg</span></p>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-themeCard rounded-2xl p-4 border border-white/5 flex flex-col gap-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-sm font-bold text-themeBlue">Calorie Balance (Today)</h3>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-themeCardHover p-3 rounded-xl flex flex-col justify-between">
                                            <span className="text-xs text-themeGray">Food Intake</span>
                                            <p className="text-xl font-bold text-themeOrange mt-1">{calorieIntake} <span className="text-xs font-normal">kcal</span></p>
                                        </div>
                                        <div className="bg-themeCardHover p-3 rounded-xl flex flex-col justify-between">
                                            <span className="text-xs text-themeGray">Workout Burn</span>
                                            <p className="text-xl font-bold text-themeGreen mt-1">-{activeCaloriesBurned} <span className="text-xs font-normal">kcal</span></p>
                                        </div>
                                    </div>
                                    <div className="mt-1 bg-themeCardHover/60 p-3 rounded-xl flex items-center justify-between border border-white/5">
                                        <span className="text-xs text-themeGray font-medium">Net Calories (Intake - Burn):</span>
                                        <span className="font-bold text-themeBlue text-base">
                                            {netCalories} kcal
                                        </span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: BROWSE */}
                        {currentTab === 'browse' && (
                            <div className="px-4 py-3 flex flex-col gap-4">
                                <div className="grid grid-cols-2 gap-3">
                                    <div onClick={() => setCurrentTab('routine')} className="bg-themeCard hover:bg-themeCardHover p-4 rounded-2xl border border-white/5 cursor-pointer flex flex-col gap-2 transition-all">
                                        <span className="text-2xl">🏋️‍♂️</span>
                                        <h4 className="text-sm font-bold text-themeOrange">Cutting Routine</h4>
                                        <p className="text-[11px] text-themeGray">Daily workouts & gym schedule</p>
                                    </div>
                                    <div onClick={() => setCurrentTab('summary')} className="bg-themeCard hover:bg-themeCardHover p-4 rounded-2xl border border-white/5 cursor-pointer flex flex-col gap-2 transition-all">
                                        <span className="text-2xl">🥗</span>
                                        <h4 className="text-sm font-bold text-themeBlue">Calorie Calculator</h4>
                                        <p className="text-[11px] text-themeGray">Intake minus workout burn</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Interactive Modal Popup */}
                    {modalConfig.isOpen && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-[#1c1c1e] w-full max-w-sm rounded-t-[32px] sm:rounded-3xl p-6 border border-white/10 shadow-2xl flex flex-col gap-4">
                                <div className="flex items-center justify-between pb-2 border-b border-white/10">
                                    <h3 className="text-base font-bold text-white">{modalConfig.title}</h3>
                                    <button onClick={() => setModalConfig({ isOpen: false, type: '', title: '' })} className="text-themeGray hover:text-white text-sm font-medium">Cancel</button>
                                </div>

                                {modalConfig.type === 'calorieIntake' && (
                                    <div className="flex flex-col gap-3 py-2">
                                        <p className="text-xs text-themeGray">Enter total calorie intake today (kcal):</p>
                                        <input 
                                            type="number" 
                                            defaultValue={calorieIntake} 
                                            id="modal-cals-intake" 
                                            className="w-full bg-themeCardHover border border-white/10 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-themeBlue"
                                        />
                                        <button 
                                            onClick={() => {
                                                const el = document.getElementById('modal-cals-intake');
                                                if (el) handleSaveModalData('calorieIntake', Number(el.value));
                                            }} 
                                            className="bg-themeOrange text-white font-semibold py-3 rounded-xl hover:opacity-95 transition-all mt-2"
                                        >
                                            Save Calorie Intake
                                        </button>
                                    </div>
                                )}

                                {modalConfig.type === 'water' && (
                                    <div className="flex flex-col gap-3 py-2">
                                        <p className="text-xs text-themeGray">Enter water intake (Liters):</p>
                                        <input 
                                            type="number" 
                                            step="0.1" 
                                            defaultValue={currentDayLog.water || 0} 
                                            id="modal-water-input" 
                                            className="w-full bg-themeCardHover border border-white/10 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-themeBlue"
                                        />
                                        <button 
                                            onClick={() => {
                                                const el = document.getElementById('modal-water-input');
                                                if (el) handleSaveModalData('water', Number(el.value));
                                            }} 
                                            className="bg-themeBlue text-white font-semibold py-3 rounded-xl hover:opacity-95 transition-all mt-2"
                                        >
                                            Save Water Intake
                                        </button>
                                    </div>
                                )}

                                {modalConfig.type === 'weight' && (
                                    <div className="flex flex-col gap-3 py-2">
                                        <p className="text-xs text-themeGray">Enter current body weight (kg):</p>
                                        <input 
                                            type="number" 
                                            step="0.1" 
                                            defaultValue={currentWeight} 
                                            id="modal-weight-input" 
                                            className="w-full bg-themeCardHover border border-white/10 rounded-xl px-4 py-3 text-white text-base focus:outline-none focus:border-themeBlue"
                                        />
                                        <button 
                                            onClick={() => {
                                                const el = document.getElementById('modal-weight-input');
                                                if (el) handleSaveModalData('weight', Number(el.value));
                                            }} 
                                            className="bg-themePurple text-white font-bold py-3 rounded-xl hover:opacity-95 transition-all mt-2"
                                        >
                                            Save Weight
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation Bar */}
                    <div className="absolute bottom-0 left-0 right-0 h-20 bg-themeDark/90 backdrop-blur-2xl border-t border-white/10 flex items-center justify-around px-2 z-40">
                        <button 
                            onClick={() => setCurrentTab('summary')}
                            className={`flex flex-col items-center gap-1 transition-all ${currentTab === 'summary' ? 'text-themeBlue scale-105' : 'text-themeGray hover:text-white'}`}
                        >
                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                            <span className="text-[10px] font-medium tracking-tight">Summary</span>
                        </button>

                        <button 
                            onClick={() => setCurrentTab('routine')}
                            className={`flex flex-col items-center gap-1 transition-all ${currentTab === 'routine' ? 'text-themeBlue scale-105' : 'text-themeGray hover:text-white'}`}
                        >
                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 6.29 3.43 4.86 2 3.43 3.43 4.86 4.86 2 6.29l1.43 1.43L2 9.14 3.43 10.57 4.86 9.14 13.43 17.71 9.86 21.29 11.29 22.72l1.43-1.43 1.43 1.43 1.43-1.43 1.43 1.43 1.43-1.43-3.57-3.57 5.72-5.72z"/></svg>
                            <span className="text-[10px] font-medium tracking-tight">Routine</span>
                        </button>

                        <button 
                            onClick={() => setCurrentTab('month')}
                            className={`flex flex-col items-center gap-1 transition-all ${currentTab === 'month' ? 'text-themeBlue scale-105' : 'text-themeGray hover:text-white'}`}
                        >
                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                            <span className="text-[10px] font-medium tracking-tight">1-Month</span>
                        </button>

                        <button 
                            onClick={() => setCurrentTab('browse')}
                            className={`flex flex-col items-center gap-1 transition-all ${currentTab === 'browse' ? 'text-themeBlue scale-105' : 'text-themeGray hover:text-white'}`}
                        >
                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4H4v4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                            <span className="text-[10px] font-medium tracking-tight">Browse</span>
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
